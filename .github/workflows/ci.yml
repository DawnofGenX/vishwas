name: ci

# The repo had NO CI at all until 2026-10-21: no .github/ directory on either
# branch, no dependency manifest, and no branch protection
# (`gh api .../branches/master/protection` -> 404 "Branch not protected").
# Every regression in this project so far — the safetensors loader, the
# health probe, the ffmpeg -vsync removal, the fusion fail-opens — could
# have been caught by a gate.
#
# Two gates, because one is not enough:
#   1. test-bare  — the hermetic suite with NO learned detectors installed.
#                   This proves the code is importable and the cheap tiers
#                   work on a bare interpreter.
#   2. test-full  — the suite with the learned detectors INSTALLED. This
#                   proves the torch-gated arch modules actually run.
#
# The distinction matters: under a bare env the torch-gated arch modules
# skip wholesale, so the suite collects 448 tests; with torch it collects
# 502. A single "437 passed" assertion is therefore really asserting "the
# detectors are not installed".

# NOTE: the `on:` key MUST be quoted. YAML 1.1 parses a bare `on` as the
# boolean True, and GitHub's workflow parser rejects the result — the run is
# created and then fails in 0 s with "This run likely failed because of a
# workflow file issue", and NO jobs are ever created. The symptom is
# indistinguishable from "the workflow is not on the default branch", which
# is why it cost real time to diagnose. `"on":` is the same key to GitHub.
"on":
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Gate 1 — hermetic, no learned detectors. Must pass everywhere.
  # ---------------------------------------------------------------------
  test-bare:
    name: hermetic suite (bare env, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the interpreter the service effectively runs under
        # (/usr/bin/python3) and the one with torch 2.4.1 + numpy 2.5.2
        # (pylibs) + pytest available.
        #
        # 3.14 is deliberately NOT in the matrix: the Hermes 3.14 tool
        # interpreter has no numpy of its own (it ships only pip), so a
        # 3.14 job would fail at COLLECTION for every test module rather
        # than test anything. If a 3.14 job is wanted, the runner image
        # must install the runtime deps first — which `pip install -e .`
        # already does below, so the matrix entry can be added as soon as a
        # 3.14 base image is used.
        python-version: ["3.12"]
    steps:
        run: echo "probe bare job"
