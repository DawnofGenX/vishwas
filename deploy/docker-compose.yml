# VeriSafe + OpenWA single-box deployment (Roadmap T4.4).
#
#   WhatsApp ⇄ openwa (REST :2785, container-internal) ⇄ verisafe webhook (:2785,
#   container-internal, route POST /webhook/inbound, health GET /health).
#
# Bring-up, webhook registration and the operator checklist live in
# docs/DEPLOYMENT.md ("Committed deployment artefacts" section).
#
# !! OPERATOR ACTION REQUIRED BEFORE FIRST RUN !!
# Nothing here is paired to any WhatsApp number. openwa starts unpaired; an
# operator must scan its QR (WhatsApp → Linked Devices) and review
# docs/DEPLOYMENT.md first. Do NOT connect a personal/production number
# without explicit operator review — every inbound message is analyzed and
# replied to by the pipeline once pairing is live.

name: verisafe

services:
  openwa:
    # Pinned to the roadmap-validated version. NOTE: Docker Hub tags are
    # UNPREFIXED (0.21.0, not v0.21.0 — the "v" form only exists on GitHub
    # and fails to pull; fixed 2026-08-22).
    image: rmyndharis/openwa:0.21.0
    restart: unless-stopped
    environment:
      # REST auth — VeriSafe's client sends it as X-API-Key (channels.py::_req).
      # REQUIRED: put it in deploy/.env (chmod 600); generate with:
      #   openssl rand -hex 32
      API_KEY: ${OPENWA_API_KEY:?set OPENWA_API_KEY in deploy/.env}
      DATA_DIR: /data                      # SQLite + session state
    volumes:
      - ./openwa-data:/data                # session persistence across restarts
    ports:
      # Host-loopback only, for operator curl of the REST API. Container-to-
      # container traffic (verisafe -> openwa) uses the compose network and
      # ignores published ports entirely.
      - "127.0.0.1:2785:2785"
    # NOTE: no public ingress anywhere — OpenWA pushes webhook events OUT to
    # verisafe over the compose network; replies go back via REST send-text.

  verisafe:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - openwa
    environment:
      # --- OpenWA client wiring (names read by src/verisafe/channels.py) ---
      OPENWA_BASE_URL: http://openwa:2785
      OPENWA_SESSION_ID: main              # default session after first QR pairing
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}  # MUST match openwa.API_KEY above
      # HMAC secret for X-OpenWA-Signature verification. If left empty the app
      # ACCEPTS UNSIGNED deliveries — documented air-gapped-only choice; set it
      # (same value OpenWA registers, see deploy/webhook.example.json).
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-}
      # --- webhook server (src/verisafe/app.py main_webhook) ---
      VERISAFE_WEBHOOK_HOST: 0.0.0.0
      VERISAFE_WEBHOOK_PORT: "2785"        # matches the --port below
      # --- resource / path wiring ---
      VERISAFE_FFMPEG_THREADS: "2"         # thermal-safe cap (i5-8250U-class)
      VERISAFE_QUARANTINE: /var/lib/verisafe/quarantine
      VERISAFE_AUDIT_LOG: /var/log/verisafe/audit.log
      VERISAFE_WORKDIR: /tmp/verisafe-work
      VERISAFE_MODELS_DIR: /opt/verisafe/models
      # Optional capability gates — leave unset until provisioned:
      # VERISAFE_VT_API_KEY: ...
      # VERISAFE_LLM_BASE_URL / VERISAFE_LLM_API_KEY / VERISAFE_LLM_MODEL: ...
    volumes:
      # Model weights stay host-side and read-only; the container never writes
      # here. Override the host side with VERISAFE_MODELS_HOST_DIR in .env
      # (e.g. /home/hermes/verisafe-models). Absent gates are skipped safely by
      # the provisioning script.
      - ${VERISAFE_MODELS_HOST_DIR:-../models}:/opt/verisafe/models:ro
      - ./quarantine:/var/lib/verisafe/quarantine
      - ./logs:/var/log/verisafe           # audit log (VERISAFE_AUDIT_LOG)
    # Provision weight env vars from the mounted models dir (no-op when the
    # mount is empty), then hand off to the standard launcher. "$$" escapes
    # compose interpolation so the shell inside the container sees "$(...)".
    entrypoint:
      - bash
      - -c
      - eval "$$(bash scripts/provision_weight_env.sh --quiet)";
        exec bash scripts/run_verisafe.sh webhook --port 2785
    healthcheck:
      # Rich JSON ops snapshot (status/uptime/jobs/quarantines/deps).
      test: ["CMD", "curl", "-fsS", "http://localhost:2785/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
