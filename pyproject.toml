[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vishwas"
version = "1.0.0"
description = "WhatsApp-first verification & safety platform: URLs, files, images, audio, video & government documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# ---------------------------------------------------------------------------
# RUNTIME DEPENDENCIES (2026-10-21)
# ---------------------------------------------------------------------------
# The repo previously had NO dependency manifest at all, so neither the test
# suite nor the service was reproducible: the bare-env suite collected 448
# tests under one interpreter and 502 under another, purely because the
# torch-gated arch modules skip wholesale when torch is absent. "437 passed"
# was therefore asserting "the detectors are not installed".
#
# These pins are the versions verified working on this host. The
# torch-gated packages are OPTIONAL extras: the hermetic bare-env suite
# must run without them, and the full-env gate installs them.
#
# IMPORTANT: torch>=2.6 is required, not preferred. The wav2vec2 frontend is
# a 1.27 GB `pytorch_model.bin` pickle and transformers 4.57+ refuses
# `torch.load` on torch<2.6 (CVE-2025-32434), so the audio gates cannot load
# at all on an older torch.

dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=5.0",
    "requests>=2.32",
    "tldextract>=5.0",
    "python-whois>=0.9",
    "validators>=0.30",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "cryptography>=42.0",
    # asn1crypto parses the CMS/PAdES envelope in src/vishwas/pades_check.py.
    # It was MISSING from this manifest while the code imported it, so the
    # gov_document signature tier silently disabled itself (app.py and
    # gov_document.py both gate on importlib.util.find_spec("asn1crypto")) and
    # 12 tests in test_12_pades.py failed in the service venv.
    "asn1crypto>=1.5",
    "pillow>=10.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# The learned detectors. Installed in the service venv and in the full-env CI
# gate. NOTE: numpy must stay 2.x — opencv 5.0 and torch 2.14 are built
# against the numpy 2 C ABI, and a numpy 1.x on the path breaks the
# accelerate/transformers import chain.
learned = [
    "torch>=2.6,<3",
    "torchvision>=0.21",
    "transformers>=4.57",
    "accelerate>=0.30",
    "soundfile>=0.12",
    "scipy>=1.11",
    "einops>=0.8",
    "yacs>=0.1.8",
    "pyarrow>=15.0",
]
# Binary-analysis helpers (also provided by the legacy /home/hermes/pylibs tree,
# which must NOT be on the PYTHONPATH: its cryptography v50 breaks the
# transformers import chain via the `lib` namespace shadow).
binary = [
    "yara-x>=1.22",
    "pefile>=2024.8",
    "lief>=1.0",
]
test = [
    "pytest>=8.0",
    # qrcode is needed by tests/test_24_qr_verify.py and
    # tests/test_25_qr_pipeline.py. Those two modules are excluded by the
    # default addopts (they also need a working numpy/cv2 ABI), but any run
    # that clears addopts -- e.g. the CI "full suite" step -- collects them
    # and fails at COLLECTION with ModuleNotFoundError if qrcode is absent.
    # It was missing from this extra, so the CI job failed on a dependency
    # the manifest had simply never declared.
    "qrcode>=7.4",
    # zxing-cpp is a HARD import in src/vishwas/qr_verify/decoder.py
    # (`import zxingcpp`), so importing that module raises without it. The
    # two QR test modules import it transitively.
    "zxing-cpp>=2.2",
]

[project.scripts]
vishwas = "vishwas.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pythonpath` only affects the test process's sys.path. The fusion_train
# tests spawn a SUBPROCESS (`python -m vishwas.fusion_train`) that inherits
# os.environ, so PYTHONPATH must ALSO be exported for the child to import
# vishwas. pytest has no built-in way to set an env var (that needs the
# pytest-env plugin), so the repo ships a conftest.py that does it — see
# tests/conftest.py.
pythonpath = ["src"]
# The two QR tests need `qrcode` + a numpy/cv2 combination that agrees on the
# ABI; under the default 3.14 interpreter without them they fail at
# COLLECTION (an import error, not a test failure). Excluding them by default
# keeps `pytest` usable out of the box; the CI matrix installs the deps and
# runs the full set.
addopts = "--ignore=tests/test_24_qr_verify.py --ignore=tests/test_25_qr_pipeline.py"
